name: AI YouTube Auto Publisher

on:
  workflow_dispatch:
    inputs:
      video_type:
        description: "Only Bhakti videos are enabled"
        required: true
        type: choice
        options:
          - bhakti
        default: bhakti
  schedule:
    # 03:00 IST = 21:30 UTC (previous day): Bhakti
    - cron: '30 21 * * *'
    # 15:00 IST = 09:30 UTC: Bhakti
    - cron: '30 9 * * *'

permissions:
  contents: read

jobs:
  generate-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore topic history
        uses: actions/cache@v4
        with:
          path: state/topic_history.json
          key: bhakti-topic-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bhakti-topic-history-
      - name: Select video profile
        id: profile
        shell: bash
        run: |
          # Both scheduled runs and manual runs are locked to Bhakti.
          PROFILE="bhakti"
          echo "content_profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Selected video profile: $PROFILE"
      - name: Check FFmpeg and install Hindi fonts only if needed
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          if ! fc-match "Noto Sans Devanagari" | grep -qi "NotoSansDevanagari"; then
            sudo apt-get install -y --no-install-recommends fonts-noto-core
          fi
          ffmpeg -version
          ffprobe -version
          fc-match "Noto Sans Devanagari"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_ANALYTICS_TOKEN_B64: ${{ secrets.YOUTUBE_ANALYTICS_TOKEN_B64 }}
          CLOUDFLARE_IMAGE_WORKER_URL: ${{ secrets.CLOUDFLARE_IMAGE_WORKER_URL }}
          CLOUDFLARE_IMAGE_TOKEN: ${{ secrets.CLOUDFLARE_IMAGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}${GEMINI_API_KEY_2:-}${GEMINI_API_KEY_3:-}" ]; then
            echo "::error::Add at least one Gemini key in GitHub Actions Secrets."
            exit 1
          fi

          export YOUTUBE_UPLOAD=false
          if [ -n "${YOUTUBE_ANALYTICS_TOKEN_B64:-}" ]; then
            printf '%s' "$YOUTUBE_ANALYTICS_TOKEN_B64" | base64 --decode > analytics_token.json
          fi
          if [ -n "${YOUTUBE_TOKEN_B64:-}" ]; then
            if ! printf '%s' "$YOUTUBE_TOKEN_B64" | base64 --decode > token.json; then
              echo "::error::YOUTUBE_TOKEN_B64 is not valid base64."
              exit 1
            fi
          elif [ -n "${YOUTUBE_CLIENT_ID:-}" ] && [ -n "${YOUTUBE_CLIENT_SECRET:-}" ] && [ -n "${YOUTUBE_REFRESH_TOKEN:-}" ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          token = {
              "token": "",
              "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": os.environ["YOUTUBE_CLIENT_ID"],
              "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
              "scopes": ["https://www.googleapis.com/auth/youtube.upload"],
              "universe_domain": "googleapis.com",
              "account": "",
              "expiry": "2000-01-01T00:00:00Z"
          }
          Path("token.json").write_text(json.dumps(token), encoding="utf-8")
          PY
          fi

          if [ -f token.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          token = json.loads(Path("token.json").read_text(encoding="utf-8"))
          if not token.get("refresh_token") or not token.get("client_id") or not token.get("client_secret"):
              raise SystemExit("YouTube OAuth credentials are incomplete. Check YOUTUBE_TOKEN_B64 or the three YOUTUBE_* secrets.")
          PY
            export YOUTUBE_UPLOAD=true
            echo "YouTube OAuth credentials validated; upload enabled."
          else
            echo "::warning::YouTube OAuth secrets are missing. Video generation will run and save an artifact, but upload will be skipped."
          fi

          python - <<'PY'
          import os
          from pathlib import Path
          values = {
              "GEMINI_API_KEY": os.environ.get("GEMINI_API_KEY", ""),
              "GEMINI_API_KEY_2": os.environ.get("GEMINI_API_KEY_2", ""),
              "GEMINI_API_KEY_3": os.environ.get("GEMINI_API_KEY_3", ""),
              "CLOUDFLARE_IMAGE_WORKER_URL": os.environ.get("CLOUDFLARE_IMAGE_WORKER_URL", ""),
              "CLOUDFLARE_IMAGE_TOKEN": os.environ.get("CLOUDFLARE_IMAGE_TOKEN", ""),
              "YOUTUBE_UPLOAD": os.environ.get("YOUTUBE_UPLOAD", "false"),
              "BACKGROUND_MUSIC_PATH": str(Path("assets/background.mp3")) if Path("assets/background.mp3").is_file() else "",
          }
          Path(".env").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8"
          )
          PY
      - name: Validate Python source
        run: |
          python -m compileall -q agent.py oauth_setup.py tests
          python -m unittest discover -s tests -v
      - name: Generate and upload
        env:
          CONTENT_PROFILE: ${{ steps.profile.outputs.content_profile }}
        run: python agent.py
      - name: Save generated video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-youtube-video-${{ github.run_number }}
          path: output/*
          retention-days: 7
      - name: Notify Telegram on success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then echo "Telegram disabled: add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets."; exit 0; fi
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          message = "✅ Bhakti video workflow successful.\nRun: " + os.environ["RUN_URL"]
          payload = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": message}).encode()
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          request = urllib.request.Request(url, data=payload)
          with urllib.request.urlopen(request, timeout=20) as response: result=json.loads(response.read().decode())
          if not result.get("ok"): raise SystemExit("Telegram API did not confirm message delivery")
          print("Telegram success notification sent.")
          PY
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then echo "Telegram disabled: add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets."; exit 0; fi
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          message = "❌ Bhakti video workflow failed. Check logs: " + os.environ["RUN_URL"]
          payload = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": message}).encode()
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          request = urllib.request.Request(url, data=payload)
          with urllib.request.urlopen(request, timeout=20) as response: result=json.loads(response.read().decode())
          if not result.get("ok"): raise SystemExit("Telegram API did not confirm message delivery")
          print("Telegram failure notification sent.")
          PY
