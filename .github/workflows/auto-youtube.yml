name: AI YouTube Auto Publisher

on:
  workflow_dispatch:
  schedule:
    # 05:00 IST = 23:30 UTC (previous day)
    - cron: '30 23 * * *'

permissions:
  contents: read

jobs:
  generate-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo 'Missing GEMINI_API_KEY secret' && exit 1)
          printf '%s' "$YOUTUBE_TOKEN_B64" | base64 -d > token.json
          python - <<'PY'
          import os
          with open('.env','w') as f:
              f.write('GEMINI_API_KEY='+os.environ['GEMINI_API_KEY']+'\n')
              f.write('YOUTUBE_UPLOAD=true\n')
          PY
      - name: Generate and upload
        run: python agent.py
      - name: Save generated video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-youtube-video-${{ github.run_number }}
          path: output/*
          retention-days: 7
