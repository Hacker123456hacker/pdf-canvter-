name: AI YouTube Auto Publisher

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 05:00 IST = 23:30 UTC (previous day)
    - cron: '30 23 * * *'

permissions:
  contents: read

jobs:
  generate-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check FFmpeg and install Hindi fonts only if needed
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          if ! fc-match "Noto Sans Devanagari" | grep -qi "NotoSansDevanagari"; then
            sudo apt-get install -y --no-install-recommends fonts-noto-core
          fi
          ffmpeg -version
          ffprobe -version
          fc-match "Noto Sans Devanagari"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}${GEMINI_API_KEY_2:-}${GEMINI_API_KEY_3:-}" ]; then
            echo "::error::Add at least one Gemini key in GitHub Actions Secrets."
            exit 1
          fi

          export YOUTUBE_UPLOAD=false
          if [ -n "${YOUTUBE_TOKEN_B64:-}" ]; then
            if ! printf '%s' "$YOUTUBE_TOKEN_B64" | base64 --decode > token.json; then
              echo "::error::YOUTUBE_TOKEN_B64 is not valid base64."
              exit 1
            fi
          elif [ -n "${YOUTUBE_CLIENT_ID:-}" ] && [ -n "${YOUTUBE_CLIENT_SECRET:-}" ] && [ -n "${YOUTUBE_REFRESH_TOKEN:-}" ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          token = {
              "token": "",
              "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": os.environ["YOUTUBE_CLIENT_ID"],
              "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
              "scopes": ["https://www.googleapis.com/auth/youtube.upload"],
              "universe_domain": "googleapis.com",
              "account": "",
              "expiry": "2000-01-01T00:00:00Z"
          }
          Path("token.json").write_text(json.dumps(token), encoding="utf-8")
          PY
          fi

          if [ -f token.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          token = json.loads(Path("token.json").read_text(encoding="utf-8"))
          if not token.get("refresh_token") or not token.get("client_id") or not token.get("client_secret"):
              raise SystemExit("YouTube OAuth credentials are incomplete. Check YOUTUBE_TOKEN_B64 or the three YOUTUBE_* secrets.")
          PY
            export YOUTUBE_UPLOAD=true
            echo "YouTube OAuth credentials validated; upload enabled."
          else
            echo "::warning::YouTube OAuth secrets are missing. Video generation will run and save an artifact, but upload will be skipped."
          fi

          python - <<'PY'
          import os
          from pathlib import Path
          values = {
              "GEMINI_API_KEY": os.environ.get("GEMINI_API_KEY", ""),
              "GEMINI_API_KEY_2": os.environ.get("GEMINI_API_KEY_2", ""),
              "GEMINI_API_KEY_3": os.environ.get("GEMINI_API_KEY_3", ""),
              "GOOGLE_CSE_API_KEY": os.environ.get("GOOGLE_CSE_API_KEY", ""),
              "GOOGLE_CSE_ID": os.environ.get("GOOGLE_CSE_ID", ""),
              "YOUTUBE_UPLOAD": os.environ.get("YOUTUBE_UPLOAD", "false"),
          }
          Path(".env").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8"
          )
          PY
      - name: Validate Python source
        run: |
          python -m compileall -q agent.py oauth_setup.py tests
          python -m unittest discover -s tests -v
      - name: Generate and upload
        run: python agent.py
      - name: Save generated video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-youtube-video-${{ github.run_number }}
          path: output/*
          retention-days: 7
