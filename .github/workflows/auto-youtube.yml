name: AI YouTube Auto Publisher

on:
  workflow_dispatch:
  schedule:
    # 05:00 IST = 23:30 UTC (previous day)
    - cron: '30 23 * * *'

permissions:
  contents: read

jobs:
  generate-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check FFmpeg and install Hindi fonts only if needed
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          if ! fc-match "Noto Sans Devanagari" | grep -qi "NotoSansDevanagari"; then
            sudo apt-get install -y --no-install-recommends fonts-noto-core
          fi
          ffmpeg -version
          ffprobe -version
          fc-match "Noto Sans Devanagari"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}${GEMINI_API_KEY_2:-}${GEMINI_API_KEY_3:-}" ]; then
            echo "::error::Add at least one Gemini key as GEMINI_API_KEY, GEMINI_API_KEY_2, or GEMINI_API_KEY_3 in Settings > Secrets and variables > Actions."
            exit 1
          fi

          export YOUTUBE_UPLOAD=false
          if [ -n "${YOUTUBE_TOKEN_B64:-}" ]; then
            if ! printf '%s' "$YOUTUBE_TOKEN_B64" | base64 --decode > token.json; then
              echo "::error::YOUTUBE_TOKEN_B64 is not valid base64. Re-create it from token.json."
              exit 1
            fi
            python - <<'PY'
          import json
          from pathlib import Path
          token = json.loads(Path("token.json").read_text(encoding="utf-8"))
          if not token.get("refresh_token"):
              raise SystemExit("OAuth token has no refresh_token. Re-run oauth_setup.py with consent and update YOUTUBE_TOKEN_B64.")
          if not token.get("client_id") or not token.get("client_secret"):
              raise SystemExit("OAuth token is missing client credentials. Re-run oauth_setup.py.")
          PY
            export YOUTUBE_UPLOAD=true
            echo "YouTube OAuth token validated; upload enabled."
          else
            echo "::warning::YOUTUBE_TOKEN_B64 is not set. Video generation will run and save an artifact, but YouTube upload will be skipped."
          fi

          python - <<'PY'
          import os
          from pathlib import Path
          values = {
              "GEMINI_API_KEY": os.environ.get("GEMINI_API_KEY", ""),
              "GEMINI_API_KEY_2": os.environ.get("GEMINI_API_KEY_2", ""),
              "GEMINI_API_KEY_3": os.environ.get("GEMINI_API_KEY_3", ""),
              "GOOGLE_CSE_API_KEY": os.environ.get("GOOGLE_CSE_API_KEY", ""),
              "GOOGLE_CSE_ID": os.environ.get("GOOGLE_CSE_ID", ""),
              "YOUTUBE_UPLOAD": os.environ.get("YOUTUBE_UPLOAD", "false"),
          }
          Path(".env").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8"
          )
          PY
      - name: Validate Python source
        run: |
          python -m compileall -q agent.py oauth_setup.py tests
          python -m unittest discover -s tests -v
      - name: Generate and upload
        run: python agent.py
      - name: Save generated video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-youtube-video-${{ github.run_number }}
          path: output/*
          retention-days: 7
