name: AI YouTube Auto Publisher

on:
  workflow_dispatch:
    inputs:
      video_type:
        description: "Only Bhakti videos are enabled"
        required: true
        type: choice
        options:
          - bhakti
        default: bhakti
      topic:
        description: "Optional custom Hindi Bhakti topic"
        required: false
        type: string
      duration_seconds:
        description: "Narration duration (30-60 seconds)"
        required: false
        type: string
        default: "55"
      voice:
        description: "Edge TTS voice name"
        required: false
        type: string
        default: "hi-IN-SwaraNeural"
      privacy:
        description: "YouTube visibility for this run"
        required: false
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public
  schedule:
    # 03:00 IST = 21:30 UTC (previous day): Bhakti
    - cron: '30 21 * * *'
    # 15:00 IST = 09:30 UTC: Bhakti
    - cron: '30 9 * * *'

permissions:
  contents: read
  actions: read

jobs:
  generate-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select video profile
        id: profile
        shell: bash
        run: |
          # Both scheduled runs and manual runs are locked to Bhakti.
          PROFILE="bhakti"
          echo "content_profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Selected video profile: $PROFILE"
      - name: Check FFmpeg and install Hindi fonts only if needed
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          if ! fc-match "Noto Sans Devanagari" | grep -qi "NotoSansDevanagari"; then
            sudo apt-get install -y --no-install-recommends fonts-noto-core
          fi
          ffmpeg -version
          ffprobe -version
          fc-match "Noto Sans Devanagari"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLOUDFLARE_IMAGE_WORKER_URL: ${{ secrets.CLOUDFLARE_IMAGE_WORKER_URL }}
          CLOUDFLARE_IMAGE_TOKEN: ${{ secrets.CLOUDFLARE_IMAGE_TOKEN }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}${GEMINI_API_KEY_2:-}${GEMINI_API_KEY_3:-}${OPENROUTER_API_KEY:-}${GROQ_API_KEY:-}" ]; then
            echo "::error::Add at least one Gemini key, OPENROUTER_API_KEY, or GROQ_API_KEY in GitHub Actions Secrets."
            exit 1
          fi

          export YOUTUBE_UPLOAD=false
          if [ -n "${YOUTUBE_TOKEN_B64:-}" ]; then
            if ! printf '%s' "$YOUTUBE_TOKEN_B64" | base64 --decode > token.json; then
              echo "::error::YOUTUBE_TOKEN_B64 is not valid base64."
              exit 1
            fi
          elif [ -n "${YOUTUBE_CLIENT_ID:-}" ] && [ -n "${YOUTUBE_CLIENT_SECRET:-}" ] && [ -n "${YOUTUBE_REFRESH_TOKEN:-}" ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          token = {
              "token": "",
              "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": os.environ["YOUTUBE_CLIENT_ID"],
              "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
              "scopes": ["https://www.googleapis.com/auth/youtube.upload"],
              "universe_domain": "googleapis.com",
              "account": "",
              "expiry": "2000-01-01T00:00:00Z"
          }
          Path("token.json").write_text(json.dumps(token), encoding="utf-8")
          PY
          fi

          if [ -f token.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          token = json.loads(Path("token.json").read_text(encoding="utf-8"))
          if not token.get("refresh_token") or not token.get("client_id") or not token.get("client_secret"):
              raise SystemExit("YouTube OAuth credentials are incomplete. Check YOUTUBE_TOKEN_B64 or the three YOUTUBE_* secrets.")
          PY
            export YOUTUBE_UPLOAD=true
            echo "YouTube OAuth credentials validated; upload enabled."
          else
            echo "::warning::YouTube OAuth secrets are missing. Video generation will run and save an artifact, but upload will be skipped."
          fi

          python - <<'PY'
          import os
          from pathlib import Path
          values = {
              "GEMINI_API_KEY": os.environ.get("GEMINI_API_KEY", ""),
              "GEMINI_API_KEY_2": os.environ.get("GEMINI_API_KEY_2", ""),
              "GEMINI_API_KEY_3": os.environ.get("GEMINI_API_KEY_3", ""),
              "OPENROUTER_API_KEY": os.environ.get("OPENROUTER_API_KEY", ""),
              "OPENROUTER_MODEL": os.environ.get("OPENROUTER_MODEL", ""),
              "GROQ_API_KEY": os.environ.get("GROQ_API_KEY", ""),
              "GROQ_MODEL": os.environ.get("GROQ_MODEL", ""),
              "CLOUDFLARE_IMAGE_WORKER_URL": os.environ.get("CLOUDFLARE_IMAGE_WORKER_URL", ""),
              "CLOUDFLARE_IMAGE_TOKEN": os.environ.get("CLOUDFLARE_IMAGE_TOKEN", ""),
              "GOOGLE_CSE_API_KEY": os.environ.get("GOOGLE_CSE_API_KEY", ""),
              "GOOGLE_CSE_ID": os.environ.get("GOOGLE_CSE_ID", ""),
              "YOUTUBE_UPLOAD": os.environ.get("YOUTUBE_UPLOAD", "false"),
          }
          Path(".env").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8"
          )
          PY
      - name: Validate Python source
        run: |
          python -m compileall -q agent.py oauth_setup.py tests
          python -m unittest discover -s tests -v
      - name: Generate and upload
        env:
          CONTENT_PROFILE: ${{ steps.profile.outputs.content_profile }}
          VIDEO_TOPIC: ${{ inputs.topic }}
          VIDEO_DURATION_SECONDS: ${{ inputs.duration_seconds }}
          VIDEO_VOICE: ${{ inputs.voice }}
          UPLOAD_PRIVACY: ${{ inputs.privacy }}
        run: python agent.py
      - name: Save generated video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-youtube-video-${{ github.run_number }}
          path: output/*
          retention-days: 7
      - name: Notify Telegram on success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then echo "::warning::Telegram success alert skipped: add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets."; exit 0; fi
          python - <<'PY'
          import glob, json, os, urllib.parse, urllib.request
          from pathlib import Path

          files = sorted(glob.glob("output/*.json"), key=os.path.getmtime, reverse=True)
          data = {}
          if files:
              try:
                  data = json.loads(Path(files[0]).read_text(encoding="utf-8"))
              except Exception as exc:
                  print("WARNING: Could not read video metadata JSON:", type(exc).__name__, str(exc)[:300])

          title = str(data.get("title") or "Title not found")
          video_id = str(data.get("youtube_video_id") or "").strip()
          video_url = "https://www.youtube.com/watch?v=" + video_id if video_id else ""
          qc = data.get("quality_check") or {}
          duration = qc.get("duration")
          duration_text = f"{float(duration):.1f} sec" if isinstance(duration, (int, float)) else "Not recorded"
          resolution = f"{qc.get('width', '?')}x{qc.get('height', '?')}"
          video_files = sorted(glob.glob("output/*.mp4"), key=os.path.getmtime, reverse=True)
          size_text = f"{Path(video_files[0]).stat().st_size / (1024 * 1024):.2f} MB" if video_files else "Not found"

          if video_id:
              upload_status = "SUCCESS — YouTube video uploaded"
              link_line = "YouTube: " + video_url
          else:
              upload_status = "WORKFLOW SUCCESS — YouTube upload was skipped/not confirmed"
              link_line = "YouTube link: Not available; check OAuth/upload settings and workflow logs"

          tags = data.get("tags") or []
          tags_text = ", ".join(str(x) for x in tags[:8]) or "Not recorded"
          message = (
              "✅ BHAKTI VIDEO WORKFLOW COMPLETED\n"
              f"Upload status: {upload_status}\n"
              f"Title: {title}\n"
              f"{link_line}\n"
              f"Video ID: {video_id or 'N/A'}\n"
              f"Duration: {duration_text} | Resolution: {resolution}\n"
              f"MP4 size: {size_text}\n"
              f"Tags: {tags_text}\n"
              f"Run: #{os.environ['RUN_NUMBER']} | Branch: {os.environ['BRANCH']}\n"
              f"Commit: {os.environ['COMMIT_SHA'][:12]}\n"
              f"Actions log: {os.environ['RUN_URL']}"
          )
          payload = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
              "disable_web_page_preview": "false" if video_url else "true",
          }).encode()
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          request = urllib.request.Request(url, data=payload)
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.loads(response.read().decode())
          if not result.get("ok"):
              raise SystemExit("Telegram API did not confirm success notification")
          print("Detailed Telegram success notification sent.")
          PY
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          CLOUDFLARE_IMAGE_TOKEN: ${{ secrets.CLOUDFLARE_IMAGE_TOKEN }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::Telegram failure alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing."
            exit 0
          fi
          python - <<'PY'
          import io, json, os, re, urllib.request, zipfile

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repo = os.environ["REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Bhakti-Workflow-Telegram-Notifier",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=35) as response:
                  return response.read()

          failed_job = "Not identified"
          failed_step = "Not identified"
          log_tail = "GitHub job log could not be retrieved; open the run link for details."
          try:
              # The failure-notification step runs before GitHub marks the whole job
              # as failed. Therefore job.conclusion can still be null/in_progress.
              # Inspect this exact run attempt and find failed STEPS independently.
              attempt = os.environ["RUN_ATTEMPT"]
              jobs_url = (
                  f"{api}/repos/{repo}/actions/runs/{run_id}/attempts/{attempt}/jobs"
                  "?per_page=100"
              )
              jobs_data = json.loads(get(jobs_url))
              jobs = jobs_data.get("jobs", [])

              candidates = []
              for item in jobs:
                  steps = item.get("steps") or []
                  bad_steps = [
                      step for step in steps
                      if step.get("conclusion") == "failure"
                  ]
                  if bad_steps or item.get("conclusion") == "failure":
                      candidates.append((item, bad_steps))

              if candidates:
                  job, bad_steps = candidates[0]
                  failed_job = job.get("name") or failed_job
                  if bad_steps:
                      failed_step = ", ".join(
                          step.get("name") or f"Step {step.get('number', '?')}"
                          for step in bad_steps
                      )
                  else:
                      failed_step = "Job failed; GitHub did not provide a failed step"

                  try:
                      raw_zip = get(f"{api}/repos/{repo}/actions/jobs/{job['id']}/logs")
                      with zipfile.ZipFile(io.BytesIO(raw_zip)) as archive:
                          chunks = [
                              archive.read(name).decode("utf-8", "replace")
                              for name in archive.namelist()
                              if name.lower().endswith(".txt")
                          ]
                          if chunks:
                              log_tail = "\n".join(chunks)[-12000:]
                  except Exception as exc:
                      log_tail = f"Could not download job log: {type(exc).__name__}: {exc}"
              else:
                  # Keep the report useful if GitHub's API has not indexed the
                  # failed step yet or the attempt endpoint is temporarily stale.
                  log_tail = (
                      "GitHub API returned jobs, but no failed step was visible "
                      "for this attempt yet. Open the run link for the live log. "
                      f"Jobs returned: {len(jobs)}."
                  )
          except Exception as exc:
              log_tail = f"Could not inspect GitHub run details: {type(exc).__name__}: {exc}"

          # Remove credentials if any were echoed by a dependency or third-party tool.
          for key, value in os.environ.items():
              if value and (key.endswith("_KEY") or "TOKEN" in key or "SECRET" in key):
                  log_tail = log_tail.replace(value, "[REDACTED]")
          log_tail = re.sub(r"(?i)(Bearer\s+)[A-Za-z0-9._~+/-]+=*", r"\1[REDACTED]", log_tail)
          log_tail = re.sub(r"(?i)(api[_-]?key|access[_-]?token|client[_-]?secret)(\s*[:=]\s*)[^\s,;]+", r"\1\2[REDACTED]", log_tail)

          # Prefer the traceback / ERROR context while retaining enough tail for diagnosis.
          lines = [line for line in log_tail.splitlines() if line.strip()]
          error_lines = [i for i, line in enumerate(lines) if re.search(r"ERROR|Error|Traceback|Exception|quota|429|failed|FAIL", line)]
          if error_lines:
              start = max(0, error_lines[-1] - 12)
              focused = "\n".join(lines[start:])[-3000:]
          else:
              focused = "\n".join(lines[-35:])[-3000:]

          message = (
              "❌ BHAKTI VIDEO WORKFLOW FAILED\n"
              f"Run: #{os.environ['RUN_NUMBER']} (attempt {os.environ['RUN_ATTEMPT']})\n"
              f"Job: {failed_job}\n"
              f"Failed step: {failed_step}\n"
              f"Branch: {os.environ['BRANCH']}\n"
              f"Event: {os.environ['EVENT_NAME']}\n"
              f"Commit: {os.environ['COMMIT_SHA'][:12]}\n\n"
              "ERROR DETAILS (log excerpt):\n" + focused +
              "\n\nFULL LOG / RUN: " + os.environ["RUN_URL"]
          )
          # Telegram sendMessage hard limit is 4096 characters.
          message = message[:3950]
          payload = __import__("urllib.parse", fromlist=["urlencode"]).urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
              "disable_web_page_preview": "true",
          }).encode()
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          req = urllib.request.Request(url, data=payload)
          with urllib.request.urlopen(req, timeout=25) as response:
              result = json.loads(response.read().decode())
          if not result.get("ok"):
              raise SystemExit("Telegram API did not confirm failure alert delivery")
          print("Detailed Telegram failure alert sent.")
          PY
