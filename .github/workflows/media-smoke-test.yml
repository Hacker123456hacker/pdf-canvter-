name: Hindi TTS and Subtitle Render Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - "agent.py"
      - "cloudflare_media.py"
      - "requirements.txt"
      - ".github/workflows/media-smoke-test.yml"
      - "config.example.json"
  push:
    branches: [phase2/bhakti-quality-upgrades]
    paths:
      - "agent.py"
      - "cloudflare_media.py"
      - "requirements.txt"
      - ".github/workflows/media-smoke-test.yml"
      - "config.example.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_UPLOAD: "false"
      CONTENT_PROFILE: "bhakti"
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core
          ffmpeg -version
          ffprobe -version
          fc-match "Noto Sans Devanagari"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate real Hindi TTS, subtitles and MP4 (no API secrets or YouTube upload)
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          from agent import tts, render, verify_video_quality

          config = {
              "video": {
                  "width": 1080,
                  "height": 1920,
                  "fps": 24,
                  "voice": "hi-IN-SwaraNeural",
                  "tts_rate": "+0%"
              }
          }
          narration = (
              "नमस्कार। आज हम एक छोटी सी प्रेरणादायक बात समझेंगे। "
              "जब भी मन में चिंता या उलझन हो, कुछ पल रुककर गहरी सांस लें। "
              "अपने विचारों को शांत करें और फिर एक छोटा, सही कदम चुनें। "
              "भगवद्गीता का एक महत्वपूर्ण संदेश है कि हमें अपने कर्म पर ध्यान देना चाहिए। "
              "परिणाम की चिंता में अपना वर्तमान काम नहीं छोड़ना चाहिए। "
              "हर दिन थोड़ा अच्छा प्रयास, धीरे धीरे बड़ा बदलाव ला सकता है। "
              "अपने परिवार और आसपास के लोगों के साथ प्रेम और सम्मान से पेश आएं। "
              "यही छोटी बातें जीवन को बेहतर बनाती हैं। धन्यवाद।"
          )
          Path("output").mkdir(exist_ok=True)
          Path("work").mkdir(exist_ok=True)
          audio, subtitles = tts(narration, config)
          image = Image.new("RGB", (1080, 1920), (25, 42, 70))
          draw = ImageDraw.Draw(image)
          draw.text((90, 850), "भक्ति • सकारात्मक विचार", fill="white")
          slide = Path("work/smoke_slide.jpg")
          image.save(slide, quality=90)
          video = render([slide], audio, config, subtitles_path=subtitles)
          report = verify_video_quality(video, config)
          if not subtitles.is_file() or subtitles.stat().st_size <= 20:
              raise SystemExit("SRT subtitle file is missing or empty")
          print("MEDIA_SMOKE_TEST_PASSED", report)
          print("Generated MP4:", video)
          PY
      - name: Upload smoke-test MP4
        uses: actions/upload-artifact@v4
        with:
          name: hindi-media-smoke-test
          path: output/*.mp4
          retention-days: 3
