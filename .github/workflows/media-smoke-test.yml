name: Hindi Media Render Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - "agent.py"
      - "cloudflare_media.py"
      - "requirements.txt"
      - ".github/workflows/media-smoke-test.yml"
      - "config.example.json"
  push:
    branches: [phase2/bhakti-quality-upgrades]
    paths:
      - "agent.py"
      - "cloudflare_media.py"
      - "requirements.txt"
      - ".github/workflows/media-smoke-test.yml"
      - "config.example.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_UPLOAD: "false"
      CONTENT_PROFILE: "bhakti"
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core
          ffmpeg -version
          ffprobe -version
          fc-match "Noto Sans Devanagari"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render MP4 with Hindi subtitles (offline; no external TTS service)
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw
          from agent import render, verify_video_quality

          config = {"video": {"width": 1080, "height": 1920, "fps": 24}}
          Path("output").mkdir(exist_ok=True)
          Path("work").mkdir(exist_ok=True)

          audio = Path("work/smoke_audio.wav")
          subprocess.run([
              "ffmpeg", "-y", "-f", "lavfi", "-i",
              "sine=frequency=440:duration=40", "-c:a", "pcm_s16le", str(audio)
          ], check=True, capture_output=True)

          subtitles = Path("work/smoke_subtitles.srt")
          subtitles.write_text(
              "1\\n00:00:00,000 --> 00:00:08,000\\nनमस्कार। आज का भक्ति संदेश।\\n\\n"
              "2\\n00:00:08,000 --> 00:00:18,000\\nमन को शांत और सकारात्मक रखें।\\n\\n"
              "3\\n00:00:18,000 --> 00:00:30,000\\nअपने कर्म पर ध्यान दें।\\n\\n"
              "4\\n00:00:30,000 --> 00:00:40,000\\nधन्यवाद।\\n",
              encoding="utf-8",
          )

          image = Image.new("RGB", (1080, 1920), (25, 42, 70))
          draw = ImageDraw.Draw(image)
          draw.text((90, 850), "भक्ति • सकारात्मक विचार", fill="white")
          slide = Path("work/smoke_slide.jpg")
          image.save(slide, quality=90)

          video = render([slide], audio, config, subtitles_path=subtitles)
          report = verify_video_quality(video, config)
          print("MEDIA_SMOKE_TEST_PASSED", report)
          print("Generated MP4:", video)
          PY
      - name: Upload smoke-test MP4
        uses: actions/upload-artifact@v4
        with:
          name: hindi-media-smoke-test
          path: output/*.mp4
          retention-days: 3
