name: Retry Failed AI YouTube Run

on:
  workflow_run:
    workflows: ["AI YouTube Auto Publisher"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-failed-run:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 5 &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Retry failed jobs (up to 5 total attempts)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Attempt ${ATTEMPT} failed. Checking whether the error is retryable..."
          set +e
          FAILED_LOG="$(gh run view "$RUN_ID" --repo "$REPOSITORY" --log-failed 2>&1)"
          LOG_STATUS=$?
          set -e
          if [ "$LOG_STATUS" -eq 0 ] && printf '%s' "$FAILED_LOG" | grep -Eiq 'Gemini API response details \(HTTP (400|401|403|404)\)|returned HTTP (400|401|403|404)|invalid_grant'; then
            echo "Permanent API/authentication error detected (HTTP 400/401/403/404 or invalid_grant). Automatic retry skipped; fix the configuration first."
            exit 0
          fi
          sleep 20
          gh run rerun "$RUN_ID" --failed --repo "$REPOSITORY"
          echo "Retry requested for a potentially transient failure. Maximum total attempts: 5."
