name: Telegram Bot Controller

on:
  schedule:
    # GitHub schedule granularity is 5 minutes; commands may take a few minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-bot-controller
  cancel-in-progress: false

jobs:
  poll-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout controller state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Process Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python telegram_control.py
